            const dk=matchMedia('(prefers-color-scheme: dark)').matches,tc=S.ith?(dk?'#ffffff':'#000000'):S.icol,bc=S.ith?(dk?'#000000':'#ffffff'):S.ibg,
            r=parseInt(bc.slice(1,3),16),g=parseInt(bc.slice(3,5),16),b=parseInt(bc.slice(5,7),16),lt=(.2126*r+.7152*g+.0722*b)/255>.5,o=$('ios');
