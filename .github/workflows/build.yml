            </div>
          </div>
          <div class="tp" data-tp="speed">
            <div class="card"><div class="it"><label>${t('spd')}<span class="v" id="spv2"></span></label><div class="chs" data-k="spm">${SPD.map(o=>`<button type="button" class="ch${S.spm===o[0]?' on':''}" data-v="${o[0]}">${o[1]}</button>`).join('')}<button type="button" class="ch${S.spm==='custom'?' on':''}" data-v="custom">${t('cust')}</button></div></div>
            <div class="it" id="spc"><label>${t('spcl')}</label><div class="rcs"><input type="text" inputmode="decimal" maxlength="5" class="ni" id="spci" value="${String(S.spc).replace('.',',')}" aria-label="${t('spcl')}"><span>×</span></div></div></div>
