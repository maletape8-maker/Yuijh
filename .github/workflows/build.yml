            <div class="stt">${t('rknote')}</div>
          </div>`}

          /* ---------- fenêtre de réglages ---------- */
          const pop=$('pop');let tab='timer';
          function buildPop(){if(S.mode==='ios')return buildIos();pop.classList.remove('ios');
            const old=pop.querySelector('.pc'),y=old?old.scrollTop:0;
            pop.innerHTML=`<div class="ph"><h3>${t('title')}</h3><span class="by">by SG</span><button type="button" id="x" aria-label="${t('close')}">&times;</button></div><div class="tabs">${TABS.map(([k,l])=>`<button type="button" class="tab${tab===k?' on':''}" data-tab="${k}">${t(l)}</button>`).join('')}</div><div class="pc">${body()}</div><div class="ft"><span>Timer by SG @sg9fex</span><button type="button" class="dcb" id="dcl">${t('dc')}</button></div>`;
            initCp();bindExtra();syn();
            pop.querySelectorAll('.ta').forEach(a=>a.onfocus=()=>{if(a.value==='BYSG')setTimeout(()=>a.select(),0)});
            showTab(tab,true);const n=pop.querySelector('.pc');if(n)n.scrollTop=y;
          }
          function fit(a){a.style.height='44px';a.style.height=Math.min(100,Math.max(44,a.scrollHeight+2))+'px'}
          function showTab(k,keep){
            tab=k;const sc=pop.querySelector('.pc');
            pop.querySelectorAll('.tp').forEach(p=>p.classList.toggle('on',p.dataset.tp===k));
            pop.querySelectorAll('.tab').forEach(b=>{const on=b.dataset.tab===k;b.classList.toggle('on',on);if(on){const q=b.parentNode;q.scrollLeft=b.offsetLeft-(q.clientWidth-b.offsetWidth)/2}});
            if(!keep&&sc)sc.scrollTop=0;
            if(k==='text')pop.querySelectorAll('.ta').forEach(fit);
            if(k==='rank')loadRank();
          }
          /* classement : même image pour tout le monde (fichier du dépôt), rafraîchie chaque minute */
          const EXT=['png','jpg','jpeg','webp'];
          function loadRank(){const b=$('rk');if(b)tryRank(b,0)}
          function tryRank(b,i){
            if(i>=EXT.length){if(!b.querySelector('img'))b.innerHTML='<div class="rkm">'+t('rkno')+'</div>';return}
            const im=new Image();im.className='rki';
            im.onload=()=>{b.innerHTML='';b.appendChild(im)};
            im.onerror=()=>tryRank(b,i+1);
            im.src=RANK+EXT[i]+'?t='+Math.floor(Date.now()/60000);
          }
          setInterval(()=>{if(pop.classList.contains('o')&&tab==='rank')loadRank()},60000);
          function openPop(){buildPop();pop.classList.remove('kb');pop.classList.add('o');rep()}
          function closePop(){try{document.activeElement.blur()}catch(e){}pop.classList.remove('o');pop.classList.remove('kb');rep()}
          /* champs numériques : on n'applique la valeur qu'à la validation (plus de saccades en tapant) */
          function commitNum(a){
            if(a.id==='spci'){let v=parseFloat(a.value.replace(',','.'));if(!(v>0))v=1;v=Math.min(10,Math.max(.1,v));S.spc=String(Math.round(v*100)/100);a.value=S.spc.replace('.',',')}
            else{const k=a.dataset.k;let v=parseInt(a.value,10);if(!v)v=k==='rx'?1440:1080;v=Math.min(8000,Math.max(200,v));S[k]=v;a.value=v}
            go();save();
          }
          pop.addEventListener('input',e=>{
            const x=e.target;
            if(x.classList.contains('ni')){x.value=x.value.replace(x.id==='spci'?/[^0-9.,]/g:/[^0-9]/g,'');return}
            const k=x.dataset.k;if(!k)return;
            S[k]=x.type==='range'?+x.value:x.value;
            const v=pop.querySelector('[data-vf="'+k+'"]');if(v)v.textContent=S[k]+(SUF[k]||'');
            if(x.tagName==='TEXTAREA')fit(x);
            go();save();
          });
          pop.addEventListener('pointerdown',e=>{if(!e.target.closest('textarea,input,select')){try{document.activeElement.blur()}catch(x){}}},true);
          let downEl=null,lastAct=0,lastSel=0;
          pop.addEventListener('change',e=>{lastSel=performance.now();if(e.target.classList.contains('ni'))commitNum(e.target)});
          /* clavier : la fenêtre remonte pour rester visible, pas de zoom */
          pop.addEventListener('focusin',e=>{
            const x=e.target;if(!x.matches||!x.matches('input.ni,textarea'))return;
            pop.classList.add('kb');
            setTimeout(()=>{const sc=pop.querySelector('.pc');if(!sc)return;const r=x.getBoundingClientRect(),c=sc.getBoundingClientRect();sc.scrollTop+=r.top-c.top-c.height/3},320);
          });
          pop.addEventListener('focusout',()=>{setTimeout(()=>{const a=document.activeElement;if(!a||!a.matches||!a.matches('input.ni,textarea'))pop.classList.remove('kb')},60)});
          const hit=e=>e.target.closest&&e.target.closest('.tg,.ch,.tab,.irh,#x,#bgp,#bgx,#dcl');
          function activate(n){
            const id=n.id;
            if(id==='bgp')return pickImg();
            if(id==='bgx')return setBg('');
            if(id==='dcl')return openDc();
