      - name: Ecrire BYSG.m
        run: |
          cat > BYSG.m <<'BYSG_M_END'
          // BYSG overlay : WKWebView transparent qui ne capte les touches QUE sur le timer
          #import <UIKit/UIKit.h>
          #import <WebKit/WebKit.h>
          #import <PhotosUI/PhotosUI.h>
          #include <mach/mach_time.h>
          #include <time.h>
          #include "fishhook.h"
          #include "chrono_html.h"

          static BOOL gStretch = NO, gGray = NO;
          static CGFloat gPct = 1.0, gRW = 1440, gRH = 1080;
          static UIView *grayView;

          // ---------- Vitesse du jeu (speed hack) ----------
          // On intercepte les horloges du système (mach_absolute_time, clock_gettime, clock_gettime_nsec_np) avec fishhook
          // et on les accélère / ralentit. À chaque changement de vitesse, on ré-ancre l'horloge pour éviter tout saut dans le temps.
          static double gSpeed = 1.0;
          typedef struct { uint64_t r, v; } Anc;
          static Anc aM, aC[16];
          static uint64_t (*o_mach)(void);
          static int (*o_cgt)(clockid_t, struct timespec *);
          static uint64_t (*o_cgtn)(clockid_t);
          static inline uint64_t scl(Anc a, uint64_t real) { return a.v + (uint64_t)((double)(real - a.r) * gSpeed); }
          static inline BOOL mono(clockid_t c) { return c == CLOCK_MONOTONIC || c == CLOCK_MONOTONIC_RAW || c == CLOCK_UPTIME_RAW; }
          static uint64_t h_mach(void) { return scl(aM, o_mach()); }
          static int h_cgt(clockid_t c, struct timespec *t) {
            int r = o_cgt(c, t);
            if (r == 0 && t && mono(c)) {
              uint64_t n = scl(aC[(int)c], (uint64_t)t->tv_sec * 1000000000ull + (uint64_t)t->tv_nsec);
              t->tv_sec = (time_t)(n / 1000000000ull);
              t->tv_nsec = (long)(n % 1000000000ull);
            }
            return r;
          }
          static uint64_t h_cgtn(clockid_t c) { uint64_t n = o_cgtn(c); return mono(c) ? scl(aC[(int)c], n) : n; }
          static void bysgSetSpeed(double s) {
            if (s < 0.1) { s = 0.1; }
            if (s > 10.0) { s = 10.0; }
            if (o_mach) { uint64_t rm = o_mach(); aM = (Anc){ rm, scl(aM, rm) }; }
            if (o_cgt) {
              clockid_t ids[3] = { CLOCK_MONOTONIC, CLOCK_MONOTONIC_RAW, CLOCK_UPTIME_RAW };
              for (int i = 0; i < 3; i++) {
                struct timespec t;
                if (o_cgt(ids[i], &t) == 0) {
                  uint64_t n = (uint64_t)t.tv_sec * 1000000000ull + (uint64_t)t.tv_nsec;
                  aC[(int)ids[i]] = (Anc){ n, scl(aC[(int)ids[i]], n) };
                }
              }
            }
            gSpeed = s;
          }
          static void bysgInstallTime(void) {
            struct rebinding rb[3] = {
              { "mach_absolute_time", (void *)h_mach, (void **)&o_mach },
              { "clock_gettime", (void *)h_cgt, (void **)&o_cgt },
              { "clock_gettime_nsec_np", (void *)h_cgtn, (void **)&o_cgtn }
            };
            rebind_symbols(rb, 3);
          }

          // ---------- Résolution étirée ----------
          // Façon PC : on choisit une résolution (ex. 1440x1080), elle est adaptée aux pixels réels du téléphone
          // (jamais plus grande que l'écran, orientation respectée), le jeu est rendu dans cette résolution puis étiré plein écran.
          // Le curseur va de 0 % (écran normal) à 100 % (résolution choisie).
          static void bysgStretch(UIWindow *w) {
            UIView *gv = w.rootViewController.view;
            if (!gv) return;
            CGSize sb = w.bounds.size;
            CGFloat sc = UIScreen.mainScreen.nativeScale, tw = sb.width, th = sb.height;
            if (gStretch && gPct >= 0.01) {
              CGFloat spw = sb.width * sc, sph = sb.height * sc;
              CGFloat lg = MAX(gRW, gRH), sh = MIN(gRW, gRH);
              CGFloat k = MIN(1.0, MIN(MAX(spw, sph) / lg, MIN(spw, sph) / sh));
              BOOL land = sb.width > sb.height;
              CGFloat rw = (land ? lg : sh) * k, rh = (land ? sh : lg) * k;
              tw = (spw + (rw - spw) * gPct) / sc;
              th = (sph + (rh - sph) * gPct) / sc;
            }
            if (fabs(tw - sb.width) < 0.5 && fabs(th - sb.height) < 0.5) {
              if (!CGAffineTransformIsIdentity(gv.transform)) { gv.transform = CGAffineTransformIdentity; gv.frame = w.bounds; }
              return;
            }
            if (fabs(gv.bounds.size.width - tw) < 0.5 && fabs(gv.bounds.size.height - th) < 0.5 && !CGAffineTransformIsIdentity(gv.transform)) return;
            gv.transform = CGAffineTransformIdentity;
            gv.bounds = CGRectMake(0, 0, tw, th);
            gv.center = CGPointMake(sb.width / 2, sb.height / 2);
            gv.transform = CGAffineTransformMakeScale(sb.width / tw, sb.height / th);
          }

          // ---------- Noir et blanc ----------
          // Une vue blanche en mode de fusion "saturation" posée au-dessus du jeu (sous le timer, qui garde ses couleurs)
          static void bysgGray(UIWindow *w) {
            if (!gGray) { if (grayView.superview) [grayView removeFromSuperview]; return; }
            if (!grayView) {
              grayView = [[UIView alloc] initWithFrame:w.bounds];
              grayView.userInteractionEnabled = NO;
              grayView.backgroundColor = UIColor.whiteColor;
              grayView.layer.compositingFilter = @"saturationBlendMode";
              grayView.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
            }
            if (grayView.superview != w) [w addSubview:grayView];
            grayView.frame = w.bounds;
          }

          static UIViewController *topVC(UIWindow *w) {
            UIViewController *v = w.rootViewController;
            while (v.presentedViewController) v = v.presentedViewController;
            return v;
          }

          @interface BYSGHost : UIView <WKScriptMessageHandler, UIScrollViewDelegate, PHPickerViewControllerDelegate>
          @property(nonatomic, strong) NSArray<NSValue *> *holes;
          @property(nonatomic, strong) WKWebView *web;
          @end

          @implementation BYSGHost
          - (instancetype)initWithFrame:(CGRect)f {
            if ((self = [super initWithFrame:f])) {
              self.backgroundColor = UIColor.clearColor;
              self.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              WKWebViewConfiguration *cfg = [WKWebViewConfiguration new];
              [cfg.userContentController addScriptMessageHandler:self name:@"r"];
              [cfg.userContentController addScriptMessageHandler:self name:@"n"];
              self.web = [[WKWebView alloc] initWithFrame:self.bounds configuration:cfg];
              self.web.autoresizingMask = self.autoresizingMask;
              self.web.opaque = NO;
              self.web.backgroundColor = UIColor.clearColor;
              self.web.scrollView.backgroundColor = UIColor.clearColor;
              self.web.scrollView.scrollEnabled = NO;
              self.web.scrollView.delegate = self;
              self.web.scrollView.contentInsetAdjustmentBehavior = UIScrollViewContentInsetAdjustmentNever;
              [self addSubview:self.web];
              [self.web loadHTMLString:[NSString stringWithUTF8String:CHRONO_HTML]
                               baseURL:[NSURL URLWithString:@"https://bysg.local/"]];
            }
            return self;
          }
          // Hors du timer : on renvoie nil => la touche passe au jeu (plus de carré invisible)
          - (UIView *)hitTest:(CGPoint)p withEvent:(UIEvent *)e {
            for (NSValue *v in self.holes)
              if (CGRectContainsPoint(CGRectInset(v.CGRectValue, -4, -4), p)) return [super hitTest:p withEvent:e];
            return nil;
          }
          // Sélecteur de photo natif (PHPicker, aucune permission requise)
          - (void)pickPhoto {
            UIWindow *w = self.window;
            if (!w) return;
            PHPickerConfiguration *c = [[PHPickerConfiguration alloc] init];
            c.filter = [PHPickerFilter imagesFilter];
            c.selectionLimit = 1;
            PHPickerViewController *p = [[PHPickerViewController alloc] initWithConfiguration:c];
            p.delegate = self;
            self.hidden = YES; // l'overlay ne doit pas couvrir le sélecteur
            [topVC(w) presentViewController:p animated:YES completion:nil];
          }
          - (void)picker:(PHPickerViewController *)picker didFinishPicking:(NSArray<PHPickerResult *> *)results {
            [picker dismissViewControllerAnimated:YES completion:nil];
            self.hidden = NO;
            PHPickerResult *r = results.firstObject;
            if (!r || ![r.itemProvider canLoadObjectOfClass:UIImage.class]) return;
            __weak BYSGHost *ws = self;
            [r.itemProvider loadObjectOfClass:UIImage.class completionHandler:^(id<NSItemProviderReading> obj, NSError *err) {
              UIImage *im = (UIImage *)obj;
              if (![im isKindOfClass:UIImage.class]) return;
              CGFloat k = MIN(1.0, 900.0 / MAX(im.size.width, im.size.height));
              CGSize ns = CGSizeMake(floor(im.size.width * k), floor(im.size.height * k));
              UIGraphicsImageRendererFormat *fmt = [UIGraphicsImageRendererFormat defaultFormat];
              fmt.scale = 1;
              UIImage *sm = [[[UIGraphicsImageRenderer alloc] initWithSize:ns format:fmt] imageWithActions:^(UIGraphicsImageRendererContext *ctx) {
                [im drawInRect:CGRectMake(0, 0, ns.width, ns.height)];
              }];
              NSData *d = UIImageJPEGRepresentation(sm, 0.82);
              if (!d) return;
              NSString *js = [NSString stringWithFormat:@"setBg('data:image/jpeg;base64,%@')", [d base64EncodedStringWithOptions:0]];
              dispatch_async(dispatch_get_main_queue(), ^{ [ws.web evaluateJavaScript:js completionHandler:nil]; });
            }];
          }
          - (void)userContentController:(WKUserContentController *)c didReceiveScriptMessage:(WKScriptMessage *)m {
            if ([m.name isEqualToString:@"n"]) {
              NSDictionary *d = m.body;
              if (![d isKindOfClass:NSDictionary.class]) return;
              if (d[@"s"] != nil) {
                gStretch = [d[@"s"] boolValue];
                if (d[@"p"] != nil) gPct = fmax(0, fmin(100, [d[@"p"] doubleValue])) / 100.0;
                if (d[@"w"] != nil) gRW = fmax(200, fmin(8000, [d[@"w"] doubleValue]));
                if (d[@"h"] != nil) gRH = fmax(200, fmin(8000, [d[@"h"] doubleValue]));
                [self.web evaluateJavaScript:[NSString stringWithFormat:@"window.NS=%f;if(window.inf)inf()", UIScreen.mainScreen.nativeScale] completionHandler:nil];
                if (self.window) bysgStretch(self.window);
              }
              if (d[@"g"] != nil) { gGray = [d[@"g"] boolValue]; if (self.window) bysgGray(self.window); }
              if (d[@"v"] != nil) bysgSetSpeed([d[@"v"] doubleValue]);
              if (d[@"pk"] != nil) { [self pickPhoto]; return; }
              NSString *u = d[@"o"];
              if ([u isKindOfClass:NSString.class] && [u hasPrefix:@"https://discord.gg/"])
                [UIApplication.sharedApplication openURL:[NSURL URLWithString:u] options:@{} completionHandler:nil];
              return;
            }
            NSArray *a = m.body;
            if (![a isKindOfClass:NSArray.class]) return;
            NSMutableArray *h = [NSMutableArray array];
            for (NSArray *r in a)
              if ([r isKindOfClass:NSArray.class] && r.count >= 4)
                [h addObject:[NSValue valueWithCGRect:CGRectMake([r[0] doubleValue], [r[1] doubleValue], [r[2] doubleValue], [r[3] doubleValue])]];
            self.holes = h;
          }
          - (void)scrollViewDidScroll:(UIScrollView *)sv {
            if (sv.contentOffset.x != 0 || sv.contentOffset.y != 0) sv.contentOffset = CGPointZero;
          }
          @end

          static BYSGHost *host;

          static UIWindow *keyWin(void) {
            for (UIScene *s in UIApplication.sharedApplication.connectedScenes)
              if ([s isKindOfClass:UIWindowScene.class] && s.activationState == UISceneActivationStateForegroundActive)
                for (UIWindow *w in ((UIWindowScene *)s).windows)
                  if (w.isKeyWindow) return w;
            return nil;
          }

          __attribute__((constructor)) static void bysg_init(void) {
            bysgInstallTime();
            dispatch_async(dispatch_get_main_queue(), ^{
              [NSTimer scheduledTimerWithTimeInterval:0.1 repeats:YES block:^(NSTimer *t) {
                UIWindow *w = keyWin();
                if (!w) return;
                bysgStretch(w);
                if (!host) host = [[BYSGHost alloc] initWithFrame:w.bounds];
                if (host.superview != w) [w addSubview:host];
                bysgGray(w);
                if (!host.hidden && host.superview == w) {
                  NSArray *sv = w.subviews;
                  BOOL ok = sv.lastObject == host && (!gGray || (sv.count > 1 && sv[sv.count - 2] == grayView));
                  if (!ok) { if (gGray) [w bringSubviewToFront:grayView]; [w bringSubviewToFront:host]; }
                }
              }];
            });
          }
          BYSG_M_END
      - name: Generer chrono_html.h
        run: |
          python3 -c "import json;open('chrono_html.h','w',encoding='utf-8').write('static const char *CHRONO_HTML = '+json.dumps(open('chrono.html',encoding='utf-8').read(),ensure_ascii=False)+';')"
      - name: Recuperer fishhook
        run: |
          for b in main master; do
            curl -fsSL -o fishhook.c "https://raw.githubusercontent.com/facebook/fishhook/$b/fishhook.c" && curl -fsSL -o fishhook.h "https://raw.githubusercontent.com/facebook/fishhook/$b/fishhook.h" && break
          done
          test -s fishhook.c && test -s fishhook.h
      - name: Compiler le dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=14.0 -fobjc-arc -dynamiclib -framework UIKit -framework WebKit -framework PhotosUI -framework Foundation -framework CoreGraphics -install_name @rpath/BYSG.dylib -o BYSG.dylib BYSG.m fishhook.c
          codesign -f -s - BYSG.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: BYSG-dylib
          path: BYSG.dylib
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: BYSG dylib
          files: BYSG.dylib
