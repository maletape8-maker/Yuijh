            cards=(k,a,f)=>`<div class="chs" data-k="${k}">${a.map(o=>`<button type="button" class="ch${f?' '+f:''}${S[k]===o[0]?' on':''}" data-v="${o[0]}"${o[2]?` style="font-family:${o[2]};font-weight:${o[3]}"`:''}>${o[1]}</button>`).join('')}</div>`,
            AN=[['none','<span>13</span><small>Aucune</small>'],['roll','<span class="rl">1<em>4<sub>3</sub></em></span><small>Roulement</small>'],['fade','<span>1<span style="opacity:.45">3</span></span><small>Fondu</small>'],['zoom','<span>1<span style="display:inline-block;transform:scale(1.25)">3</span></span><small>Zoom</small>']],
            FN=[['serif','Serif'],['bold','Gras'],['din','Condensé'],['sans','Sans'],['mono','Mono'],['slab','Slab']].map(o=>[o[0],'12:58',IF[o[0]][0],IF[o[0]][1]]),
            MD=[['chrono','Chrono'],['livesplit','LiveSplit'],['ios','iOS Timer'],['none','Texte seul']];
            pop.innerHTML=`<button type="button" id="x" aria-label="Fermer"></button><div class="ipc">
            <div class="ig">${tg('ith','Thème du système')}${tg('ilive','Activités en direct')}${cr('icol','Texte')}${cr('ibg','Fond')}</div>
            <div class="ist">Taille</div>
